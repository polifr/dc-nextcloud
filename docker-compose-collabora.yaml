services:
  nc-collabora-documentserver:
    image: collabora/code:26.04.5.2.1
    restart: unless-stopped
    environment:
      aliasgroup1: "https://nextcloud.local:443,https://nextcloud\\.local:443"
      extra_params: "--o:ssl.enable=false --o:ssl.termination=true"
      dictionaries: "it_IT en_US"
    expose:
      - 9980
    networks:
      - nc-proxy-network

  nc-nextcloud:
    volumes:
      - ./nc-nextcloud/post-installation/collabora.sh:/docker-entrypoint-hooks.d/post-installation/collabora.sh:ro
      - ./nc-nextcloud/before-starting/collabora.sh:/docker-entrypoint-hooks.d/before-starting/collabora.sh:ro
    depends_on:
      nc-collabora-documentserver:
        condition: service_started

  nc-nginx:
    volumes:
      - ./nc-nginx/config/default-collabora.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      nc-nextcloud:
        condition: service_started
