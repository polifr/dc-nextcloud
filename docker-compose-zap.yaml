volumes:
  nc-zap-data-volume:
    driver: local

services:
  nc-zap:
    build:
      context: ./nc-zap
      dockerfile: Dockerfile
      args:
        ZAP_PROXY_VERSION: ${ZAP_PROXY_VERSION}
    image: nc-zap:latest
    container_name: nc-zap
    restart: unless-stopped
    environment:
      ZAP_API_KEY: ${ZAP_API_KEY}
    ports:
      - "127.0.0.1:8080:8080"
    command:
      - zap.sh
      - -daemon
      - -host
      - 0.0.0.0
      - -port
      - "8080"
      - -config
      - api.key=${ZAP_API_KEY}
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
    volumes:
      - ./nc-zap/wrk:/zap/wrk:rw
      - nc-zap-data-volume:/home/zap/.ZAP
    healthcheck:
      start_period: 60s
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - nc-proxy-network
