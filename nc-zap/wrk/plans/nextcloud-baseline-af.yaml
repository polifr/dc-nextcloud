env:
  contexts:
  - name: nextcloud-authenticated
    urls:
    - https://nextcloud.local
    includePaths:
    - https://nextcloud.local.*
    authentication:
      method: browser
      parameters:
        browserId: firefox-headless
        diagnostics: true
        loginPageWait: 20
        loginPageUrl: https://nextcloud.local/login
        steps: []
        stepDelay: 0
      verification:
        method: poll
        loggedInRegex: \Q 200 OK\E
        loggedOutRegex: \Q 303 See Other\E
        pollFrequency: 60
        pollUnits: requests
        pollUrl: https://nextcloud.local/apps/dashboard/
        pollPostData: ""
        pollAdditionalHeaders:
        - header: user-agent
          value: Mozilla/5.0 (X11; Linux x86_64; rv:153.0) Gecko/20100101 Firefox/153.0
        - header: accept
          value: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
        - header: accept-language
          value: "en-US,en;q=0.9"
        - header: connection
          value: keep-alive
    sessionManagement:
      method: headers
    technology: {}
    structure: {}
    users:
    - name: zap-test
      credentials:
        password: my-n3xtcl0u4
        username: zap-test
  parameters: {}
jobs:
- type: passiveScan-config
  parameters: {}
- type: spider
  parameters:
    context: nextcloud-authenticated
    user: zap-test
    url: https://nextcloud.local
    maxDuration: 5
    parseDsStore: null
  tests:
  - name: At least 100 URLs found
    type: stats
    onFail: INFO
    statistic: automation.spider.urls.added
    operator: '>='
    value: 100
- type: spiderClient
  parameters:
    context: nextcloud-authenticated
    user: zap-test
    url: https://nextcloud.local
    maxDuration: 5
    maxChildren: 0
    numberOfBrowsers: 2
    browserId: firefox-headless
- type: passiveScan-wait
  parameters:
    maxDuration: 5
- type: report
  parameters:
    theme: original
    reportDir: /zap/wrk/reports
    reportFile: "{{yyyy-MM-dd}}-ZAP-Report-[[site]]-risk"
    reportTitle: ZAP by Checkmarx Scanning Report
  risks:
  - low
  - medium
  - high
  confidences:
  - low
  - medium
  - high
  - confirmed
  sections:
  - siteRiskCounts
  - responseBody
  - appendix
  - insights
  - alertTypes
  - responseHeader
  - alertTypeCounts
  - riskConfidenceCounts
  - alerts
  - aboutThisReport
  - contents
  - requestBody
  - reportDescription
  - reportParameters
  - requestHeader
  - summaries
- type: report
  parameters:
    template: modern
    theme: corporate
    reportDir: /zap/wrk/reports
    reportFile: "{{yyyy-MM-dd}}-ZAP-Report-[[site]]-modern"
    reportTitle: ZAP by Checkmarx Scanning Report
  risks:
  - info
  - low
  - medium
  - high
  confidences:
  - falsepositive
  - low
  - medium
  - high
  - confirmed
  sections:
  - passingrules
  - insights
  - instancecount
  - alertdetails
  - alertcount
  - params
  - chart
  - statistics
- type: exitStatus
  parameters: {}

