name: Build and integration tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      NEXTCLOUD_HOST: nextcloud.local

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Docker
        run: |
          docker version
          docker compose version

      - name: Configure hostname
        run: |
          echo "127.0.0.1 ${NEXTCLOUD_HOST}" | sudo tee -a /etc/hosts

      - name: Initialize environment
        run: |
          make init-environment

      - name: Create certificates
        run: |
          make create-certificates

      - name: Start Nextcloud
        run: |
          make start

      - name: ZAP Baseline Scan
        run: |
          mkdir -p "$RUNNER_TEMP/zap"
          docker run --rm \
            --add-host=${NEXTCLOUD_HOST}:host-gateway \
            -v "$RUNNER_TEMP/zap:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t https://${NEXTCLOUD_HOST} \
            -r zap-report.html

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-security-report
          path: ${{ runner.temp }}/zap/zap-report.html
          if-no-files-found: warn
          retention-days: 30

      - name: Stop Nextcloud
        if: always()
        run: |
          make clean
