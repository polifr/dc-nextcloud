name: Build and integration tests - Automation Framework

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      NEXTCLOUD_HOST: nextcloud.local

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Docker
        run: |
          docker version
          docker compose version

      - name: Configure hostname
        run: |
          echo "127.0.0.1 ${NEXTCLOUD_HOST}" | sudo tee -a /etc/hosts

      - name: Initialize environment
        run: |
          make init-environment

      - name: Create certificates
        run: |
          make create-certificates

      - name: Start Nextcloud
        run: |
          make start

      - name: ZAP Automation Framework Scan
        run: |
          mkdir -p "$RUNNER_TEMP/zap"
          chmod a+w "$RUNNER_TEMP/zap"
          docker run --rm \
            --add-host=${NEXTCLOUD_HOST}:host-gateway \
            --env-file "$GITHUB_WORKSPACE/.env" \
            -v "$GITHUB_WORKSPACE/nc-zap/wrk/plans:/zap/plans:rw" \
            -v "$RUNNER_TEMP/zap:/zap/wrk:rw" \
            --entrypoint /bin/sh \
            zaproxy/zap-stable:2.17.0 \
            -c '
              echo "Updating ZAP add-ons..."
              zap.sh -cmd -addonupdate

              echo "Starting ZAP Automation Framework scan..."
              zap.sh -cmd \
                -autorun /zap/plans/nextcloud-baseline-af.yaml

              scan_status=$?

              if [ -f "$HOME/.ZAP/zap.log" ]; then
                cp "$HOME/.ZAP/zap.log" /zap/wrk/zap.log
                echo "ZAP log copied successfully."
              else
                echo "WARNING: ZAP log not found in $HOME/.ZAP/" >&2
              fi

              exit $scan_status
            '

      - name: Stop Nextcloud
        if: always()
        run: |
          make stop

      - name: Collect Docker Compose logs
        if: always()
        run: |
          make logs > "$RUNNER_TEMP/docker-compose.log" 2>&1 || true

      - name: Upload Docker Compose logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-compose-logs
          path: ${{ runner.temp }}/docker-compose.log
          if-no-files-found: warn
          retention-days: 30
          archive: false

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-security-reports
          path: ${{ runner.temp }}/zap/*
          if-no-files-found: warn
          retention-days: 30

      - name: Upload ZAP log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-security-log
          path: ${{ runner.temp }}/zap/zap.log
          if-no-files-found: warn
          retention-days: 30
          archive: false

      - name: Stop Nextcloud
        if: always()
        run: |
          make clean
