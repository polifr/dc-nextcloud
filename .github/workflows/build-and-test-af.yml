name: Build and integration tests - Automation Framework

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      NEXTCLOUD_HOST: nextcloud.local

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Docker
        run: |
          docker version
          docker compose version

      - name: Initialize environment
        run: |
          make init-environment

      - name: Export ZAP API key
        shell: bash
        run: |
          set -euo pipefail
      
          ZAP_API_KEY="$(python3 - <<'PY'
          from pathlib import Path
      
          for line in Path(".env").read_text().splitlines():
              if line.startswith("ZAP_API_KEY="):
                  print(line.partition("=")[2])
                  break
          else:
              raise SystemExit("ZAP_API_KEY non trovata nel .env")
          PY
          )"
      
          if [[ -z "$ZAP_API_KEY" ]]; then
            echo "ZAP_API_KEY vuota"
            exit 1
          fi
      
          echo "::add-mask::$ZAP_API_KEY"
          echo "ZAP_API_KEY=$ZAP_API_KEY" >> "$GITHUB_ENV"

      - name: Create certificates
        run: |
          make create-certificates

      - name: Verify ZAP plan
        shell: bash
        run: |
          set -euo pipefail
      
          PLAN_DIRECTORY="${GITHUB_WORKSPACE}/nc-zap/wrk/plans"
          PLAN_FILE="${PLAN_DIRECTORY}/nextcloud-baseline-af.yaml"
      
          echo "Repository directory: $GITHUB_WORKSPACE"
          echo "Plan atteso: $PLAN_FILE"
      
          if [[ ! -f "$PLAN_FILE" ]]; then
            echo "::error::ZAP plan non trovato nel repository"
            echo "Contenuto della directory plans:"
            ls -la "$PLAN_DIRECTORY" || true
            exit 1
          fi
      
          echo "Plan presente:"
          ls -l "$PLAN_FILE"

      - name: Start Nextcloud
        run: |
          make enable-zap start

      - name: Verify ZAP plan in container
        run: |
          set -euo pipefail

          PLAN_FILE="/zap/wrk/plans/nextcloud-baseline-af.yaml"

          docker exec nc-zap sh -c "
            if [ ! -f '$PLAN_FILE' ]; then
              echo 'ERROR: plan non trovato nel container ZAP'
              ls -la /zap/wrk
              ls -la /zap/wrk/plans || true
              exit 1
            fi

            echo 'Plan trovato nel container:'
            ls -l '$PLAN_FILE'
          "

      - name: Run ZAP Automation Plan
        shell: bash
        run: |
          set -euo pipefail

          ZAP_API="http://localhost:8080"
          PLAN_FILE="/zap/wrk/plans/nextcloud-baseline-af.yaml"
          MAX_WAIT_SECONDS=3600
          POLL_INTERVAL=5

          echo "Avvio del piano ZAP: $PLAN_FILE"

          # Avvia il piano e acquisisce il planId
          START_RESPONSE="$(curl --fail --silent --show-error \
            --get \
            --header "X-ZAP-API-Key: ${ZAP_API_KEY}" \
            --data-urlencode "filePath=${PLAN_FILE}" \
            "${ZAP_API}/JSON/automation/action/runPlan/")"

          echo "$START_RESPONSE" | jq .

          PLAN_ID="$(echo "$START_RESPONSE" | jq -r '.planId // empty')"

          if [[ -z "$PLAN_ID" ]]; then
            echo "Errore: ZAP non ha restituito un planId."
            exit 1
          fi

          echo "Piano avviato. planId=$PLAN_ID"

          START_TIME=$SECONDS

          # Attende il completamento
          while true; do
            PROGRESS_RESPONSE="$(curl --fail --silent --show-error \
              --get \
              --header "X-ZAP-API-Key: ${ZAP_API_KEY}" \
              --data-urlencode "planId=${PLAN_ID}" \
              "${ZAP_API}/JSON/automation/view/planProgress/")"

            FINISHED="$(echo "$PROGRESS_RESPONSE" | jq -r '.finished // empty')"

            if [[ -n "$FINISHED" ]]; then
              break
            fi

            ELAPSED=$((SECONDS - START_TIME))

            if (( ELAPSED >= MAX_WAIT_SECONDS )); then
              echo "Timeout: il piano non è terminato entro ${MAX_WAIT_SECONDS} secondi."

              curl --silent --show-error \
                --get \
                --header "X-ZAP-API-Key: ${ZAP_API_KEY}" \
                --data-urlencode "planId=${PLAN_ID}" \
                "${ZAP_API}/JSON/automation/action/stopPlan/" || true

              exit 1
            fi

            echo "Piano ancora in esecuzione (${ELAPSED}s)..."
            sleep "$POLL_INTERVAL"
          done

          echo "Piano terminato alle: $FINISHED"

          echo "Risultato finale:"
          echo "$PROGRESS_RESPONSE" | jq .

          ERRORS="$(echo "$PROGRESS_RESPONSE" | jq -r '.error | length')"

          if (( ERRORS > 0 )); then
            echo "Il piano ZAP è terminato con errori."
            exit 1
          fi

          echo "Piano ZAP completato senza errori."

      - name: Copy ZAP logs
        if: always()
        run: |
          docker exec -u 0 nc-zap sh -c '
            mkdir -p /zap/wrk/logs
            cp /home/zap/.ZAP/zap.log /zap/wrk/logs/zap.log
          '

      - name: Stop Nextcloud
        if: always()
        run: |
          make enable-zap stop

      - name: Collect Docker Compose logs
        if: always()
        run: |
          make enable-zap logs > "$RUNNER_TEMP/docker-compose.log" 2>&1 || true

      - name: Upload Docker Compose logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-compose-logs
          path: ${{ runner.temp }}/docker-compose.log
          if-no-files-found: warn
          retention-days: 30
          archive: false

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-security-reports
          path: ./nc-zap/wrk/reports/*
          if-no-files-found: warn
          retention-days: 30

      - name: Upload ZAP log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-security-log
          path: ./nc-zap/wrk/logs/zap.log
          if-no-files-found: warn
          retention-days: 30
          archive: false

      - name: Stop Nextcloud
        if: always()
        run: |
          make clean
