include /etc/nginx/includes/common/http-globals.conf;

#
# HTTP -> HTTPS
#
server {
    listen 80;
    server_name nextcloud.local;
    return 301 https://$host$request_uri;
}

#
# HTTPS reverse proxy
#
server {

    listen 443 ssl;
    server_name nextcloud.local;

    ssl_certificate     /etc/nginx/certs/nextcloud.local.crt;
    ssl_certificate_key /etc/nginx/certs/nextcloud.local.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10G;

    #
    # Nextcloud
    #
    location / {
        include /etc/nginx/includes/common/proxy-headers.conf;

        proxy_pass http://nc-nextcloud;
    }

    #
    # Document servers
    #
    include /etc/nginx/includes/document-servers/*.conf;
}
