name: dc-nextcloud

volumes:
  nc-postgres-volume:
    driver: local
  nc-ldap-data-volume:
    driver: local
  nc-ldap-config-volume:
    driver: local
  nc-nextcloud-volume:
    driver: local

services:
  nc-postgresql:
    image: "postgres:18"
    restart: unless-stopped
    environment:
      POSTGRES_USER: "nextcloud"
      POSTGRES_PASSWORD: "nextcloud"
      POSTGRES_DB: "nextcloud"
    volumes:
      - nc-postgres-volume:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - 5432
    networks:
      - nc-proxy-network

  nc-redis:
    image: redis:8-alpine
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - 6379
    networks:
      - nc-proxy-network

  nc-ldap:
    image: osixia/openldap:1.5.0
    command: --copy-service
    restart: unless-stopped
    environment:
      LDAP_ORGANIZATION: "Nextcloud Local"
      LDAP_DOMAIN: "nextcloud.local"
      LDAP_ADMIN_PASSWORD: "my-n3xtcl0u4"
      LDAP_READONLY_USER: "true"
      LDAP_READONLY_USER_USERNAME: "nc-ldap-bind"
      LDAP_READONLY_USER_PASSWORD: "my-n3xtcl0u4"
    volumes:
      - nc-ldap-data-volume:/var/lib/ldap
      - nc-ldap-config-volume:/etc/ldap/slapd.d
      - ./nc-ldap/bootstrap:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro
    healthcheck:
      test: ["CMD-SHELL", "ldapwhoami -x -H ldap://localhost -D cn=admin,dc=nextcloud,dc=local -w \"$$LDAP_ADMIN_PASSWORD\""]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - 389
      - 636
    networks:
      - nc-proxy-network

  nc-nextcloud:
    build:
      context: ./nc-nextcloud
      dockerfile: Dockerfile
    image: nc-nextcloud:latest
    restart: unless-stopped
    expose:
      - 80
    volumes:
      - nc-nextcloud-volume:/var/www/html
      - ./nc-nextcloud/post-installation/common-apps.sh:/docker-entrypoint-hooks.d/post-installation/common-apps.sh:ro
      - ./nc-nextcloud/post-installation/${OFFICE_TYPE}.sh:/docker-entrypoint-hooks.d/post-installation/${OFFICE_TYPE}.sh:ro
      - ./nc-nextcloud/before-starting/common-config.sh:/docker-entrypoint-hooks.d/before-starting/common-config.sh:ro
      - ./nc-nextcloud/before-starting/${OFFICE_TYPE}.sh:/docker-entrypoint-hooks.d/before-starting/${OFFICE_TYPE}.sh:ro
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud
      POSTGRES_HOST: nc-postgresql
      REDIS_HOST: nc-redis
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: my-n3xtcl0u4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/status.php"]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - nc-proxy-network
    depends_on:
      nc-redis:
        condition: service_healthy
      nc-postgresql:
        condition: service_healthy
      nc-ldap:
        condition: service_healthy

  nc-nginx:
    image: nginx:1.31-alpine-slim
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nc-nginx/config/default-${OFFICE_TYPE}.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nc-nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      nc-proxy-network:
        aliases:
          - nextcloud.local

    depends_on:
      nc-nextcloud:
        condition: service_healthy

networks:
  nc-proxy-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
