name: dc-nextcloud

volumes:
  nc-postgres-volume:
    driver: local
  nc-ldap-data-volume:
    driver: local
  nc-ldap-config-volume:
    driver: local
  nc-nextcloud-volume:
    driver: local

services:
  nc-postgresql:
    image: "postgres:18"
    hostname: ${POSTGRES_HOST}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - nc-postgres-volume:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - 5432
    networks:
      - nc-proxy-network

  nc-redis:
    image: redis:8-alpine
    hostname: ${REDIS_HOST}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - 6379
    networks:
      - nc-proxy-network

  nc-ldap:
    image: osixia/openldap:1.5.0
    hostname: ${LDAP_HOST}
    command: --copy-service
    restart: unless-stopped
    environment:
      LDAP_ORGANIZATION: "Nextcloud Local"
      LDAP_DOMAIN: ${LDAP_DOMAIN}
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      LDAP_READONLY_USER: "true"
      LDAP_READONLY_USER_USERNAME: ${LDAP_READONLY_USER_USERNAME}
      LDAP_READONLY_USER_PASSWORD: ${LDAP_READONLY_USER_PASSWORD}
    volumes:
      - nc-ldap-data-volume:/var/lib/ldap
      - nc-ldap-config-volume:/etc/ldap/slapd.d
      - ./nc-ldap/bootstrap:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro
    healthcheck:
      test: ["CMD-SHELL", "ldapwhoami -x -H ldap://localhost -D cn=admin,dc=nextcloud,dc=local -w \"$$LDAP_ADMIN_PASSWORD\""]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - 389
      - 636
    networks:
      - nc-proxy-network

  nc-nextcloud:
    build:
      context: ./nc-nextcloud
      dockerfile: Dockerfile
    image: nc-nextcloud:latest
    restart: unless-stopped
    expose:
      - 80
    volumes:
      - nc-nextcloud-volume:/var/www/html
      - ./nc-nextcloud/post-installation/common-apps.sh:/docker-entrypoint-hooks.d/post-installation/common-apps.sh:ro
      - ./nc-nextcloud/before-starting/common-config.sh:/docker-entrypoint-hooks.d/before-starting/common-config.sh:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      REDIS_HOST: ${REDIS_HOST}
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      OC_PASS: ${NEXTCLOUD_COMMON_PASSWORD}
      LDAP_HOST: ${LDAP_HOST}
      LDAP_DOMAIN: ${LDAP_DOMAIN}
      LDAP_BASE_DN: ${LDAP_BASE_DN}
      LDAP_READONLY_USER_USERNAME: ${LDAP_READONLY_USER_USERNAME}
      LDAP_READONLY_USER_PASSWORD: ${LDAP_READONLY_USER_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/status.php"]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - nc-proxy-network
    depends_on:
      nc-redis:
        condition: service_healthy
      nc-postgresql:
        condition: service_healthy
      nc-ldap:
        condition: service_healthy

  nc-talk-hpb:
    image: ghcr.io/nextcloud-releases/aio-talk:latest
    restart: unless-stopped
    environment:
      NC_DOMAIN: nextcloud.local
      TALK_HOST: nextcloud.local
      TALK_PORT: "3478"
      TURN_SECRET: ${TALK_TURN_SECRET}
      SIGNALING_SECRET: ${TALK_SIGNALING_SECRET}
      INTERNAL_SECRET: ${TALK_INTERNAL_SECRET}
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nc-proxy-network

  nc-nginx:
    build:
      context: ./nc-nginx
      dockerfile: Dockerfile
    image: nc-nginx:latest
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nc-nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      nc-proxy-network:
        aliases:
          - nextcloud.local

    depends_on:
      nc-nextcloud:
        condition: service_healthy

networks:
  nc-proxy-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
