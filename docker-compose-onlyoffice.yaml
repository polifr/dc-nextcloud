services:
  nc-onlyoffice-documentserver:
    image: onlyoffice/documentserver:10.0
    restart: unless-stopped
    environment:
      REDIS_SERVER_HOST: nc-redis
      JWT_ENABLED: "true"
      JWT_SECRET: nc_jwt_secret_012345678901234567
      JWT_HEADER: Authorization
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - 80
    volumes:
      - ./nc-nginx/certs/nextcloud.local.crt:/var/www/onlyoffice/Data/certs/extra-ca-certs.pem:ro
    networks:
      - nc-proxy-network
    depends_on:
      nc-redis:
        condition: service_healthy

  nc-nextcloud:
    volumes:
      - ./nc-nextcloud/post-installation/onlyoffice.sh:/docker-entrypoint-hooks.d/post-installation/onlyoffice.sh:ro
      - ./nc-nextcloud/before-starting/onlyoffice.sh:/docker-entrypoint-hooks.d/before-starting/onlyoffice.sh:ro

  nc-nginx:
    volumes:
      - ./nc-nginx/config/default-onlyoffice.conf:/etc/nginx/conf.d/default.conf:ro
